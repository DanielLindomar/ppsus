project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!dados_site/"
  resources:
    - arquivos/

website:
  title: "Observatório PPSUS-MT"
  description: "Dados, indicadores e eficiência do SUS nos municípios de Mato Grosso — Projeto Gestão Integrada no SUS (PPSUS 004/2025)"
  site-url: https://daniellindomar.github.io/ppsus/
  repo-url: https://github.com/daniellindomar/ppsus
  repo-actions: [issue]
  favicon: assets/favicon.png
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#0E5A5E"
    foreground: "#ffffff"
    logo: assets/logos/unemat-branco.png
    logo-alt: "UNEMAT — Universidade do Estado de Mato Grosso"
    left:
      - href: index.qmd
        text: Início
      - href: municipios/index.qmd
        text: Municípios
      - href: indicadores/index.qmd
        text: Indicadores
      - href: deslocamento/index.qmd
        text: Deslocamento
      - href: eficiencia.qmd
        text: "Eficiência (em construção)"
      - href: dados/index.qmd
        text: Dados
      - href: metodologia.qmd
        text: Metodologia
      - href: sobre.qmd
        text: Sobre
    right:
      - icon: github
        href: https://github.com/daniellindomar/ppsus
        aria-label: "Código-fonte no GitHub"
  page-footer:
    center: |
      :::: {.rodape}
      ::: {.rodape-logos}
      [Realização]{.rodape-rotulo} ![UNEMAT — Universidade do Estado de Mato Grosso](/assets/logos/unemat.png){.rodape-logo}
      :::
      ::: {.rodape-logos}
      [Financiamento]{.rodape-rotulo} ![PPSUS — Programa Pesquisa para o SUS: Mato Grosso](/assets/logos/ppsus-mt.png){.rodape-logo} ![FAPEMAT — Fundação de Amparo à Pesquisa do Estado de Mato Grosso](/assets/logos/fapemat.png){.rodape-logo} ![SES-MT — Secretaria de Estado de Saúde · Governo de Mato Grosso](/assets/logos/ses-mt.png){.rodape-logo} ![CNPq — Conselho Nacional de Desenvolvimento Científico e Tecnológico](/assets/logos/cnpq.png){.rodape-logo} ![SUS · Ministério da Saúde · Governo do Brasil](/assets/logos/ministerio-saude-sus.png){.rodape-logo}
      :::
      [Projeto financiado pelo Programa Pesquisa para o SUS: gestão compartilhada em saúde (PPSUS) — Edital FAPEMAT nº 004/2025, processo FAPEMAT-PRO.0001999/2025 — com recursos da FAPEMAT, do CNPq, do Decit/SECTICS/Ministério da Saúde e da SES-MT. Execução: UNEMAT, Campus de Sinop.]{.rodape-citacao}

      [Versão 0.1 · atualizado em 01/10/2026 · Conteúdo sob licença CC BY 4.0 · [Código-fonte](https://github.com/daniellindomar/ppsus)]{.rodape-versao}
      ::::

format:
  html:
    theme: [cosmo, estilo.scss]
    lang: pt-BR
    toc: true
    toc-depth: 2
    toc-title: "Nesta página"
    smooth-scroll: true
    link-external-newwindow: true
    lightbox: auto
    include-after-body: assets/glossario.html

execute:
  echo: false
  warning: false
  message: false

engine: knitr
